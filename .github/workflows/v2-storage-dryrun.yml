name: Radar V2 segment storage dry run and preparation research
on:
  push:
    paths:
      - 'v2/storage_segments.py'
      - 'v2/preparation_research.py'
      - 'v2/tests/test_storage_segments.py'
      - 'v2/tests/test_preparation_research.py'
      - 'v2/flow_discovery.py'
      - 'v2/tests/test_flow_discovery.py'
      - 'v2/trace_economic_routes.py'
      - 'v2/tests/test_trace_economic_routes.py'
      - 'v2/economic_brain.py'
      - 'v2/dynamic_wallet_monitor.py'
      - 'v2/tests/test_dynamic_wallet_monitor.py'
      - 'v2/spot_microstructure.py'
      - 'v2/tests/test_spot_microstructure.py'
      - 'v2/economic_fusion.py'
      - 'v2/tests/test_economic_fusion.py'
      - 'v2/technical_confirmation.py'
      - 'v2/tests/test_technical_confirmation.py'
      - '.github/workflows/v2-storage-dryrun.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run all offline regression tests
        run: python -m unittest discover -s v2/tests -q
      - name: Restore current immutable anchor plus all archived segments in isolation
        shell: bash
        run: |
          set -euo pipefail
          cp -a v2_archive /tmp/radar-segments
          python v2/storage_segments.py restore /tmp/radar-segments /tmp/radar-restored.sqlite3
          python - <<'PY'
          import sys,json,sqlite3
          sys.path.insert(0,'v2')
          from storage_segments import semantic_digest
          d=json.load(open('v2_state/audit.json'))
          c=sqlite3.connect('/tmp/radar-restored.sqlite3')
          for table,key in [('market_candles','total_spot_bars'),('wallet_balances','total_wallet_balances'),('token_transfers','total_token_transfers'),('runs','total_runs')]:
              got=c.execute('select count(*) from '+table).fetchone()[0]
              if got!=d[key]:raise AssertionError(f'ARCHIVE_MIGRATION_ROW_MISMATCH {table}: {got}!={d[key]}')
          print('REAL_CHECKPOINT_RESTORED_AND_VERIFIED',semantic_digest('/tmp/radar-restored.sqlite3'))
          PY
      - name: Prove full-size historical archive plus real delta reconstruction
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/radar-restored.sqlite3 /tmp/radar-before.sqlite3
          cp /tmp/radar-restored.sqlite3 /tmp/radar-after.sqlite3
          python - <<'PY'
          import sys,sqlite3
          sys.path.insert(0,'v2')
          from radar_stage1 import Store,MINUTE_MS
          st=Store('/tmp/radar-after.sqlite3')
          t=1900000000000;t=(t//60000)*60000
          rid=st.begin_run(t)
          bar={'minute_ms':t,'open':1.,'high':1.2,'low':.9,'close':1.1,'quote_vol':123.}
          st.market_save(rid,'ON','gate','ON_USDT','OK',t,t+MINUTE_MS,[bar],observed_ms=t)
          st.finish_run(rid,t);st.close()
          PY
          python v2/storage_segments.py append /tmp/radar-segments /tmp/radar-before.sqlite3 /tmp/radar-after.sqlite3
          python v2/storage_segments.py restore /tmp/radar-segments /tmp/radar-confirmed.sqlite3
          python - <<'PY'
          import sys
          sys.path.insert(0,'v2')
          from storage_segments import semantic_digest
          b=semantic_digest('/tmp/radar-after.sqlite3')
          c=semantic_digest('/tmp/radar-confirmed.sqlite3')
          assert b==c,(b,c)
          print('FULL_SIZE_REAL_ARCHIVE_PLUS_INCREMENTAL_DELTA_VALIDATED',b['counts'])
          PY
      - name: Generate evidence-only 15-token preparation report
        run: |
          python v2/preparation_research.py --db /tmp/radar-restored.sqlite3 --config v2/config.json --out /tmp/v2-preparation-research.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v2-preparation-research.json'))
          assert len(x['coins'])==15
          assert all(z['classification']=='RESEARCH_ONLY_NOT_BUY_SIGNAL' for z in x['coins'])
          print('ALL_15_RESEARCH_REPORT_OK')
          for z in x['coins']:
              print('RESEARCH_COIN',z['coin'],'events',z['transfers']['events'],'verified_cex',z['verified_exchange_addresses'],'candidate_cex',z['unverified_exchange_candidates'])
          PY

      - name: Run economic brain against complete REAL archived SQLite (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python v2/storage_segments.py restore v2_archive /tmp/v2-brain-real.sqlite3
          python v2/economic_brain.py --db /tmp/v2-brain-real.sqlite3 \
            --config v2/config.json --out /tmp/v2-economic-brain.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v2-economic-brain.json'))
          assert len(x['coins'])==15
          assert x['ready_for_automated_strong_alerts'] is False
          assert all(not z['strong_signal'] and not z['buy_signal'] for z in x['coins'])
          for z in x['coins']:
            print('REAL_DATA_ECONOMIC_BRAIN',z['coin'],'class',z['classification'],
                  'watched_wallets',len(z['wallet_accumulation_candidates']),
                  'transfer_events',z['observed_events_last_5000_blocks'],
                  'verified_cex_wallets',z['verified_cex_wallet_count'])
          print('ECONOMIC_BRAIN_REAL_15_COIN_CHECK_PASSED')
          PY
      - name: Discover new address flow research on REAL archival data (no alerts)
        shell: bash
        run: |
          set -euo pipefail
          python v2/flow_discovery.py --db /tmp/v2-brain-real.sqlite3 \
            --config v2/config.json --out /tmp/v2-flow-discovery.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v2-flow-discovery.json'))
          assert len(x['coins'])==15
          assert x['strong_alert'] is False and x['buy_signal'] is False
          for z in x['coins']:
            assert z['strong_alert'] is False
            print('DISCOVERY_COIN',z['coin'],'events',z['observed_event_count'],
              'positive_addresses',z['observed_net_positive_addresses'],
              'unverified_research_candidates',z['candidate_count'],
              'dex_dominated',len(z['dex_dominated_receivers']))
          for z in x['coins']:
            for v in z['watch_candidates'][:3]:
              print('UNVERIFIED_WATCH_REVIEW',z['coin'],
                'address',v['address'],
                'net_raw',v['net_received_raw'],
                'net_tokens',v['net_received'],
                'recent_tokens',v['recent_net_received'],
                'source_count',v['source_address_count_unverified'],
                'in_txs',v['distinct_inflow_transactions'],
                'source_types',v['source_types'],
                'sample_txs',v['sample_incoming_transactions'])
          print('FLOW_DISCOVERY_REAL_15_COIN_CHECK_PASSED')
          PY
      - name: Trace same-amount pass-through in real 15-token history (no exit claim)
        shell: bash
        run: |
          set -euo pipefail
          python v2/trace_economic_routes.py --db /tmp/v2-brain-real.sqlite3 \
            --config v2/config.json --out /tmp/v2-transfer-trace.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v2-transfer-trace.json'))
          assert len(x['coins'])==15 and x['signal'] is False
          assert x['no_verified_cex_withdrawal_claim'] is True
          for z in x['coins']:
            print('ROUTE_REVIEW',z['coin'],'labeled_cex_events',
              z.get('observed_from_candidate_cex',0),'exact_relay_hypotheses',
              z.get('exact_relays',0))
            for y in z.get('traces',[])[:2]:
              print('ROUTE_SAMPLE',z['coin'],'token_amount_raw',y['coin_amount_raw'],
                'path',[(i['block'],i['from'],i['to']) for i in y['path']],
                'class',y['classification'])
          print('ROUTE_REVIEW_COMPLETE_NO_STRONG_ALERTS')
          PY
      - name: Propose real dynamic-wallet follow-ups WITHOUT network or database writes
        shell: bash
        run: |
          set -euo pipefail
          python v2/dynamic_wallet_monitor.py --db /tmp/v2-brain-real.sqlite3 \
            --config v2/config.json --propose-only --out /tmp/v2-dynamic-proposals.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/v2-dynamic-proposals.json'))
          assert len(x['coins'])==15 and x['strong_alert'] is False
          print('DYNAMIC_EOA_PROPOSAL_SELECTION',sum(v['count'] for v in x['coins']))
          for v in x['coins']:
            print('DYNAMIC_RESEARCH',v['coin'],'selected',v['count'],
                  'eligible_receivers',v.get('eligible_unlabeled_receivers'),
                  'coverage',v['coverage_status'])
          PY
      - name: Publish research-only evidence report as short-lived workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2-preparation-research-dryrun
          path: |
            /tmp/v2-preparation-research.json
            /tmp/v2-economic-brain.json
            /tmp/v2-flow-discovery.json
            /tmp/v2-transfer-trace.json
            /tmp/v2-dynamic-proposals.json
          retention-days: 7
