name: Radar V2 hourly collection with lossless incremental storage

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'v2/**'
      - '.github/workflows/radar-v2-stage1-hourly.yml'

permissions:
  contents: write

concurrency:
  group: radar-v2-stage1-hourly-v3
  cancel-in-progress: false

jobs:
  live-collect-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline acceptance tests before network collection
        run: python -m unittest discover -s v2/tests -q
      - name: Restore and independently verify preserved history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2_runtime
          if test -f v2_archive/manifest.json; then
            cp -a v2_archive v2_runtime/segment_store
            python v2/storage_segments.py restore v2_runtime/segment_store v2_runtime/live.sqlite3
            echo 'RESTORED_FROM_INCREMENTAL_STORAGE'
          elif test -f v2_state/checkpoint.sqlite.gz; then
            python v2/backup_restore.py restore v2_state/checkpoint.sqlite.gz v2_runtime/live.sqlite3
            python v2/storage_segments.py migrate v2_state/checkpoint.sqlite.gz v2_runtime/segment_store
            echo 'MIGRATED_EXISTING_FULL_CHECKPOINT_WITHOUT_DELETING_OLD_COPY'
          else
            echo 'FAIL_CLOSED: neither verifiable legacy checkpoint nor segment manifest exists'
            exit 1
          fi
          cp v2_runtime/live.sqlite3 v2_runtime/before.sqlite3
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'v2')
          from storage_segments import semantic_digest
          d=semantic_digest('v2_runtime/before.sqlite3')
          expected=json.load(open('v2_runtime/segment_store/manifest.json'))['tip_digest']
          if d!=expected:raise RuntimeError('RESTORED_PRECOLLECTION_TIP_MISMATCH')
          print('VERIFIED_RESTORED_ROWS',d['counts'])
          PY
      - name: Read 15-token live sources without orders
        id: capture
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 1800s \
            python -u v2/radar_stage1.py --db v2_runtime/live.sqlite3 \
              --config v2/config.json --report-path v2_runtime/last_run.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "COLLECTOR_EXIT_CODE=$code"
          exit 0
      - name: Bounded independent missing spot minute repair
        id: repair
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 240s \
            python -u v2/gap_repair.py --db v2_runtime/live.sqlite3 \
              --config v2/config.json --report-path v2_runtime/last_run.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "GAP_REPAIR_EXIT_CODE=$code"
          exit 0
      - name: Observe newly discovered EOA candidates at same-chain confirmed block
        id: dynamic
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 480s \
            python -u v2/dynamic_wallet_monitor.py --db v2_runtime/live.sqlite3 \
              --config v2/config.json --out v2_runtime/dynamic_wallets.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "DYNAMIC_EOA_EXIT_CODE=$code"
          exit 0
      - name: Public spot fill-side and top-of-book sampling, no buy signals
        id: spot_tape
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 420s \
            python -u v2/spot_microstructure.py --db v2_runtime/live.sqlite3 \
              --config v2/config.json --out v2_runtime/spot_microstructure.json \
              --archive v2_runtime/spot_microstructure.json.gz
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "SPOT_MICRO_EXIT_CODE=$code"
          exit 0
      - name: Fail-closed health report, preserve partial observations
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.capture.outputs.exit_code }}
          GAP_REPAIR_EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
          DYNAMIC_EOA_EXIT_CODE: ${{ steps.dynamic.outputs.exit_code }}
          SPOT_MICRO_EXIT_CODE: ${{ steps.spot_tape.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json,sqlite3,os,datetime
          from pathlib import Path
          root=Path('v2_runtime');db=root/'live.sqlite3'
          if not db.exists():raise RuntimeError('MISSING_RESTORED_SQLITE')
          c=sqlite3.connect(db)
          if c.execute('PRAGMA quick_check').fetchone()[0]!='ok':raise RuntimeError('CORRUPT_SQLITE')
          interrupted=c.execute("UPDATE runs SET status='INTERRUPTED_NO_COMPLETE_EVIDENCE',finished_ms=cast(strftime('%s','now') as integer)*1000 WHERE status='RUNNING'").rowcount
          c.commit()
          latest=c.execute('SELECT run_id,status FROM runs ORDER BY started_ms DESC LIMIT 1').fetchone()
          def n(q):return c.execute(q).fetchone()[0]
          d={'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
             'collector_exit_code':int(os.environ.get('COLLECTOR_EXIT_CODE') or -1),
             'gap_repair_exit_code':int(os.environ.get('GAP_REPAIR_EXIT_CODE') or -1),
             'dynamic_eoa_exit_code':int(os.environ.get('DYNAMIC_EOA_EXIT_CODE') or -1),
             'spot_micro_exit_code':int(os.environ.get('SPOT_MICRO_EXIT_CODE') or -1),
             'total_dynamic_eoa_balance_observations':n("SELECT COUNT(*) FROM wallet_checks WHERE status='OK' AND detail='DYNAMIC_EOA_CODE_VERIFIED_OWNER_UNKNOWN'"),
             'total_gap_repair_attempts':n('SELECT COUNT(*) FROM spot_gap_repairs') if c.execute("SELECT 1 FROM sqlite_master WHERE name='spot_gap_repairs'").fetchone() else 0,
             'last_run_id':latest[0] if latest else None,
             'last_run_status':latest[1] if latest else 'NO_RUN',
             'total_runs':n('SELECT COUNT(*) FROM runs'),
             'total_spot_bars':n('SELECT COUNT(*) FROM market_candles'),
             'total_wallet_balances':n('SELECT COUNT(*) FROM wallet_balances'),
             'total_token_transfers':n('SELECT COUNT(*) FROM token_transfers'),
             'unknown_market_minutes':n('SELECT COUNT(*) FROM market_missing_minutes'),
             'total_source_gap_events':n('SELECT COUNT(*) FROM source_gaps'),
             'interrupted_runs_marked':interrupted,
             'storage':'VERIFIED_INCREMENTAL_SEGMENTS_AND_IMMUTABLE_ANCHOR',
             'note':'Unverified CEX labels, sparse candles or partial chain scans must not become buy signals.'}
          (root/'audit.json').write_text(json.dumps(d,indent=2)+'\n')
          c.close()
          print(json.dumps(d,indent=2))
          PY
      - name: Derive conservative 15-token preparation research, not buy alerts
        run: |
          python v2/preparation_research.py --db v2_runtime/live.sqlite3 \
            --config v2/config.json --out v2_runtime/preparation_research.json
      - name: Analyze economic transfer classes and balance-correlated preparation watch
        run: |
          python v2/economic_brain.py --db v2_runtime/live.sqlite3 \
            --config v2/config.json --out v2_runtime/economic_brain.json
      - name: Discover untracked onchain receivers as research candidates only
        run: |
          python v2/flow_discovery.py --db v2_runtime/live.sqlite3 \
            --config v2/config.json --out v2_runtime/flow_discovery.json
      - name: Trace exact token relays from public-labeled exchange candidates
        run: |
          python v2/trace_economic_routes.py --db v2_runtime/live.sqlite3 \
            --config v2/config.json --out v2_runtime/transfer_trace.json
      - name: Fuse independent accumulation and ignition research paths without buy alerts
        shell: bash
        run: |
          set -euo pipefail
          if test -f v2_runtime/spot_microstructure.json; then
            python v2/economic_fusion.py \
              --spot v2_runtime/spot_microstructure.json \
              --economic v2_runtime/economic_brain.json \
              --history v2_archive/spot_samples \
              --out v2_runtime/economic_fusion.json
          else
            echo 'SPOT_MICROSTRUCTURE_MISSING_FUSION_UNKNOWN_NOT_ZERO'
          fi
      - name: Build minimal new data segment and verify whole restored history
        run: |
          python v2/storage_segments.py append v2_runtime/segment_store \
            v2_runtime/before.sqlite3 v2_runtime/live.sqlite3
          python v2/storage_segments.py restore v2_runtime/segment_store v2_runtime/verified.sqlite3
          python - <<'PY'
          import sys
          sys.path.insert(0,'v2')
          from storage_segments import semantic_digest
          if semantic_digest('v2_runtime/verified.sqlite3')!=semantic_digest('v2_runtime/live.sqlite3'):
            raise RuntimeError('INCREMENTAL_RESTORE_DATA_LOSS')
          print('FULL_DATABASE_SEMANTIC_DIGEST_IDENTICAL')
          PY
      - name: Commit only immutable new segment plus small current reports
        shell: bash
        run: |
          set -euo pipefail
          CODE_SHA="$(git rev-parse HEAD)"
          SNAP="$(mktemp -d)"
          trap 'rm -rf "$SNAP"' EXIT
          cp -a v2_runtime/segment_store "$SNAP/store"
          cp v2_runtime/audit.json "$SNAP/audit.json"
          cp v2_runtime/preparation_research.json "$SNAP/preparation_research.json"
          cp v2_runtime/economic_brain.json "$SNAP/economic_brain.json"
          cp v2_runtime/flow_discovery.json "$SNAP/flow_discovery.json"
          cp v2_runtime/transfer_trace.json "$SNAP/transfer_trace.json"
          if test -f v2_runtime/economic_fusion.json; then cp v2_runtime/economic_fusion.json "$SNAP/economic_fusion.json"; fi
          if test -f v2_runtime/dynamic_wallets.json; then cp v2_runtime/dynamic_wallets.json "$SNAP/dynamic_wallets.json"; fi
          if test -f v2_runtime/spot_microstructure.json && test -f v2_runtime/spot_microstructure.json.gz; then
            cp v2_runtime/spot_microstructure.json "$SNAP/spot_microstructure.json"
            cp v2_runtime/spot_microstructure.json.gz "$SNAP/spot_microstructure.json.gz"
          fi
          if test -f v2_runtime/last_run.json; then
            cp v2_runtime/last_run.json "$SNAP/last_run.json"
          fi
          CURRENT_MANIFEST_SHA=$(if test -f v2_archive/manifest.json; then sha256sum v2_archive/manifest.json | cut -d' ' -f1; else echo 'ABSENT'; fi)
          git config user.name 'radar-v2-storage-bot'
          git config user.email 'radar-v2-storage-bot@users.noreply.github.com'
          git fetch origin main
          if ! git diff --quiet "$CODE_SHA" origin/main -- v2/ .github/workflows/radar-v2-stage1-hourly.yml; then
            echo 'FAIL_CLOSED: code changed during collection; keep prior published history unchanged'; exit 1
          fi
          REMOTE_MANIFEST_SHA=$(if git cat-file -e origin/main:v2_archive/manifest.json 2>/dev/null; then git show origin/main:v2_archive/manifest.json | sha256sum | cut -d' ' -f1; else echo 'ABSENT'; fi)
          if test "$CURRENT_MANIFEST_SHA" != "$REMOTE_MANIFEST_SHA"; then
            echo 'FAIL_CLOSED: another writer advanced the data manifest'; exit 1
          fi
          git reset --hard origin/main
          mkdir -p v2_archive/segments v2_state
          if ! test -f v2_archive/anchor/checkpoint.sqlite.gz; then
            mkdir -p v2_archive/anchor
            cp "$SNAP/store/anchor/checkpoint.sqlite.gz" v2_archive/anchor/
            cp "$SNAP/store/anchor/checkpoint.sqlite.gz.sha256.json" v2_archive/anchor/
          fi
          cp -n "$SNAP/store"/segments/* v2_archive/segments/ 2>/dev/null || true
          cp "$SNAP/store/manifest.json" v2_archive/manifest.json
          cp "$SNAP/audit.json" v2_state/audit.json
          cp "$SNAP/preparation_research.json" v2_state/preparation_research.json
          cp "$SNAP/economic_brain.json" v2_state/economic_brain.json
          cp "$SNAP/flow_discovery.json" v2_state/flow_discovery.json
          cp "$SNAP/transfer_trace.json" v2_state/transfer_trace.json
          if test -f "$SNAP/economic_fusion.json"; then cp "$SNAP/economic_fusion.json" v2_state/economic_fusion.json; fi
          if test -f "$SNAP/dynamic_wallets.json"; then cp "$SNAP/dynamic_wallets.json" v2_state/dynamic_wallets.json; fi
          if test -f "$SNAP/spot_microstructure.json"; then
            cp "$SNAP/spot_microstructure.json" v2_state/spot_microstructure.json
            SAMPLE_RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id"])' "$SNAP/spot_microstructure.json")"
            if ! [[ "$SAMPLE_RUN_ID" =~ ^[0-9a-f]{18}$ ]]; then
              echo 'FAIL_CLOSED: invalid public spot sample run id'; exit 1
            fi
            mkdir -p v2_archive/spot_samples
            DEST="v2_archive/spot_samples/${SAMPLE_RUN_ID}.json.gz"
            if test -f "$DEST"; then
              cmp "$DEST" "$SNAP/spot_microstructure.json.gz" || exit 1
            else
              cp "$SNAP/spot_microstructure.json.gz" "$DEST"
            fi
          fi
          if test -f "$SNAP/last_run.json"; then cp "$SNAP/last_run.json" v2_state/last_run.json; fi
          git add v2_archive v2_state/audit.json v2_state/preparation_research.json v2_state/economic_brain.json v2_state/flow_discovery.json v2_state/transfer_trace.json v2_state/last_run.json
          if test -f v2_state/dynamic_wallets.json; then git add v2_state/dynamic_wallets.json; fi
          if test -f v2_state/spot_microstructure.json; then git add v2_state/spot_microstructure.json; fi
          if test -f v2_state/economic_fusion.json; then git add v2_state/economic_fusion.json; fi
          # NEVER add or overwrite v2_state/checkpoint.sqlite.gz: old backup remains available.
          git commit -m "V2 verified lossless incremental segment $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
          echo 'COMMITTED_INCREMENTAL_SEGMENT_AND_RESEARCH_REPORT'
  verify-new-runner:
    needs: live-collect-and-save
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore from immutable anchor and all segments independently
        run: |
          set -euo pipefail
          python v2/storage_segments.py restore v2_archive verified_next_runner.sqlite3
          python - <<'PY'
          import json,sqlite3
          d=json.load(open('v2_state/audit.json'))
          c=sqlite3.connect('verified_next_runner.sqlite3')
          for t,key in [('runs','total_runs'),('market_candles','total_spot_bars'),('wallet_balances','total_wallet_balances'),('token_transfers','total_token_transfers')]:
            n=c.execute('SELECT COUNT(*) FROM '+t).fetchone()[0]
            if n!=d[key]:raise RuntimeError(f'CROSS_RUNNER_ROW_MISMATCH {t} {n}!={d[key]}')
          print('INDEPENDENT_RUNNER_ALL_HISTORY_RESTORED',d['total_runs'],d['total_spot_bars'],d['total_token_transfers'])
          PY
