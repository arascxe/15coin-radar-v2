name: V2 economic evidence + delivery acceptance
on:
  pull_request:
    paths:
      - 'v2_full/**'
      - 'v2/verified_cex_entities.json'
      - 'tests/**'
      - '.github/workflows/v2-live-spot-5min.yml'
      - '.github/workflows/v2-evidence-proof-ci.yml'
permissions:
  contents: read
jobs:
  evidence-code-and-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regression tests for 15 coin and evidence
        env:
          PYTHONPATH: '.:v2'
        run: |
          python -m unittest discover -s tests -q
          python -m unittest discover -s v2/tests -q
      - name: Test one actual live public market and BSC wallet proof window
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet websocket-client
          mkdir -p /tmp/v2-evidence-smoke
          export PYTHONPATH=.:v2
          set +e
          timeout --signal=TERM --kill-after=10s 310s \
            python -u -m v2_full.monitor --config v2/config.json \
              --verified-cex v2/verified_cex_entities.json \
              --output-dir /tmp/v2-evidence-smoke \
              --interval-sec 10 --max-seconds 280
          code=$?
          echo "MONITOR_EXIT_CODE=$code"
          python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('/tmp/v2-evidence-smoke/live_15_coin_economic_state.json')
          if not p.exists():
              print('LIVE_EVIDENCE_REPORT_MISSING — NOT ACCEPTED')
              raise SystemExit(1)
          d=json.loads(p.read_text())
          states=collections.Counter(c['state'] for c in d['coins'])
          print('COINS',len(d['coins']),'STATES',dict(states))
          print('CEX_AUDITED_SOURCE_ADDRESSES',d.get('verified_exchange_source_addresses'))
          print('ONCHAIN_ECONOMIC_ENGINE',d.get('onchain_economic_engine_status'))
          print('ONCHAIN_EVIDENCE',[(c['coin'],c.get('onchain_economics',{}).get('research_state')) for c in d['coins']])
          print('PROOF_HEALTH',d.get('balance_proof_health'))
          print('CHAINS',d.get('chain_health'))
          print('IDENTITY_STATUS',collections.Counter(d.get('exchange_pair_identity',{}).values()))
          assert len(d['coins'])==15
          assert d.get('onchain_economic_engine_status')=='COMPLETE_FRESH', 'ONCHAIN_ECONOMICS_NOT_LIVE_ACCEPTED'
          assert all(c.get('onchain_economics',{}).get('coin')==c.get('coin') for c in d['coins'])
          from v2_full.entities import load_entities
          assert d.get('verified_exchange_source_addresses')==len(load_entities('v2/verified_cex_entities.json'))
          assert d.get('verified_exchange_source_addresses')>=1
          PY
          test "$code" -eq 0
      - name: Preserve raw acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-evidence-acceptance-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/v2-evidence-smoke/live_15_coin_economic_state.json
            /tmp/v2-evidence-smoke/balance_proof_ledger.json
            /tmp/v2-evidence-smoke/preparation_memory.json
            /tmp/v2-evidence-smoke/economic_event_outbox.json
            /tmp/v2-evidence-smoke/latest_chain_tail.json
