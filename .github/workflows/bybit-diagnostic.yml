name: V2 Bybit public spot endpoint diagnostic
on:
  push:
    paths: ['.github/workflows/bybit-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test BSB spot read-only Bybit public endpoints
        run: |
          python - <<'PY'
          import sys,json,concurrent.futures
          sys.path.insert(0,'v2')
          from radar_stage1 import HTTPClient
          sites=['api.bybit.com','api.bytick.com','api.bybit.nl','api.bybitglobal.com','api.bybit.kz','api.bybit.ae']
          def get(host):
            import urllib.request,urllib.parse
            url=f'https://{host}/v5/market/kline?category=spot&symbol=BSBUSDT&interval=1&limit=5'
            item={'host':host}
            try:
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=6) as res:d=json.load(res)
              item.update({'code':d.get('retCode'),'msg':str(d.get('retMsg'))[:90],'bars':len(d.get('result',{}).get('list') or [])})
            except Exception as e:item['error']=str(e)[:125]
            return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            for x in pool.map(get,sites):print('BYBIT_SPOT_API='+json.dumps(x),flush=True)
          PY
